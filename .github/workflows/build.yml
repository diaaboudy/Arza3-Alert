name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build
        run: |
          ls -la
          unzip -q -o "$(ls *.zip | head -n1)" -d project
          G=$(find project -name gradlew | head -n1)
          echo "gradlew at: $G"
          cd "$(dirname "$G")"
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: AlertMaker-APK
          path: project/**/app/build/outputs/apk/debug/*.apk
